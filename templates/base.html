{{ define "base" }}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ template "title" . }}</title>
    <meta name="description" content="A calm, premium workspace for authors to invite trusted reviewers and collect page-by-page book feedback.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
  </head>
  <body>
    {{ template "content" . }}
    <footer class="legal-footer">
      <div class="container legal-footer-row">
        <p>readperfect is a private early-access review workspace for authors and invited readers.</p>
        <nav class="legal-nav" aria-label="Legal">
          <a href="/privacy">Privacy</a>
          <a href="/terms">Terms</a>
          <a href="/contact">Contact</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
{{ end }}
