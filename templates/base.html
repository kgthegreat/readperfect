{{ define "base" }}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ template "title" . }}</title>
    <meta name="description" content="A calm workspace for authors to invite trusted reviewers and collect page-by-page feedback.">
	<meta property="og:type" content="website">
    <meta property="og:url" content="https://readperfect.com/">
    <meta property="og:title" content="ReadPerfect | Perfect your book before the world reads it">
    <meta property="og:description" content="A calm workspace for authors to invite trusted reviewers and collect page-by-page feedback">
    <meta property="og:image" content="https://readperfect.com/static/img/og-image.png">

    
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://readperfect.com/">
    <meta property="twitter:title" content="ReadPerfect | Perfect your book before the world reads it">
    <meta property="twitter:description" content="A calm workspace for authors to invite trusted reviewers and collect page-by-page feedback.">
    <meta property="twitter:image" content="https://readperfect.com/static/img/og-image.png">
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
	
    <link rel="apple-touch-icon" href="/static/img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <script>
      document.addEventListener("htmx:beforeSwap", function (event) {
        if (event.detail.xhr.status === 422) {
          event.detail.shouldSwap = true;
          event.detail.isError = false;
        }
      });
    </script>
  </head>
  <body>
    {{ template "content" . }}
    <footer class="legal-footer">
      <div class="container legal-footer-row">
        <p>readperfect is a private early-access review workspace for authors and invited readers.</p>
        <nav class="legal-nav" aria-label="Legal">
          <a href="/privacy">Privacy</a>
          <a href="/terms">Terms</a>
          <a href="/contact">Contact</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
{{ end }}
